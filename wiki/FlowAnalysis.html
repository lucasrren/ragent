<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Ragent 智能体项目多条核心业务链路的可视化流程分析，涵盖智能问答、文档入库、会话记忆、模型路由、反馈、Trace、MCP、认证、Dashboard 与定时刷新。">
<meta name="keywords" content="Ragent, RAG, 流程分析, 业务链路, 智能问答, 模型路由, 会话记忆">
<title>Ragent 业务链路流程分析</title>
<style>
/* ==================== CSS 变量与全局重置 ==================== */
:root {
  --bg-primary: #1e1e2e;
  --bg-secondary: #181825;
  --bg-tertiary: #313244;
  --bg-surface: #45475a;
  --text-primary: #cdd6f4;
  --text-secondary: #a6adc8;
  --text-muted: #6c7086;
  --accent-blue: #89b4fa;
  --accent-green: #a6e3a1;
  --accent-orange: #fab387;
  --accent-purple: #cba6f7;
  --accent-red: #f38ba8;
  --accent-gray: #9399b2;
  --accent-teal: #94e2d5;
  --border-color: #45475a;
  --hover-bg: #313244;
  --shadow: 0 4px 24px rgba(0,0,0,0.4);
  --radius: 8px;
  --sidebar-width: 280px;
  /* 节点颜色 */
  --node-user: #89b4fa;
  --node-data: #a6e3a1;
  --node-ai: #fab387;
  --node-storage: #cba6f7;
  --node-decision: #f38ba8;
  --node-async: #9399b2;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans SC', sans-serif;
  background: var(--bg-primary);
  color: var(--text-primary);
  overflow: hidden;
  height: 100vh;
}

/* ==================== 顶部标题栏 ==================== */
.header {
  height: 56px;
  background: var(--bg-secondary);
  border-bottom: 1px solid var(--border-color);
  display: flex;
  align-items: center;
  padding: 0 24px;
  gap: 16px;
  z-index: 100;
}
.header-logo {
  font-size: 20px;
  font-weight: 700;
  color: var(--accent-blue);
  letter-spacing: 1px;
}
.header-divider {
  width: 1px;
  height: 24px;
  background: var(--border-color);
}
.header-title {
  font-size: 14px;
  color: var(--text-secondary);
}
.header-badge {
  margin-left: auto;
  font-size: 12px;
  padding: 4px 12px;
  background: var(--bg-tertiary);
  border-radius: 12px;
  color: var(--text-muted);
}

/* ==================== 主布局 ==================== */
.main-layout {
  display: flex;
  height: calc(100vh - 56px);
}

/* ==================== 左侧导航菜单 ==================== */
.sidebar {
  width: var(--sidebar-width);
  min-width: var(--sidebar-width);
  background: var(--bg-secondary);
  border-right: 1px solid var(--border-color);
  display: flex;
  flex-direction: column;
  overflow-y: auto;
}
.sidebar-section-title {
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 1.5px;
  color: var(--text-muted);
  padding: 20px 20px 8px;
}
.nav-item {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  padding: 12px 20px;
  cursor: pointer;
  border-left: 3px solid transparent;
  transition: all 0.2s ease;
}
.nav-item:hover {
  background: var(--hover-bg);
}
.nav-item.active {
  background: rgba(137, 180, 250, 0.08);
  border-left-color: var(--accent-blue);
}
.nav-icon {
  width: 32px;
  height: 32px;
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
  flex-shrink: 0;
  margin-top: 2px;
}
.nav-text { flex: 1; }
.nav-text-title {
  font-size: 13px;
  font-weight: 600;
  color: var(--text-primary);
  line-height: 1.4;
}
.nav-text-desc {
  font-size: 11px;
  color: var(--text-muted);
  margin-top: 2px;
  line-height: 1.4;
}

/* 图例 */
.legend {
  padding: 16px 20px;
  border-top: 1px solid var(--border-color);
  margin-top: auto;
}
.legend-title {
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 1.5px;
  color: var(--text-muted);
  margin-bottom: 10px;
}
.legend-item {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 3px 0;
  font-size: 12px;
  color: var(--text-secondary);
}
.legend-dot {
  width: 10px;
  height: 10px;
  border-radius: 3px;
  flex-shrink: 0;
}

/* ==================== 右侧内容区域 ==================== */
.content {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  position: relative;
}

/* 链路信息头部 */
.flow-header {
  padding: 20px 28px;
  background: var(--bg-secondary);
  border-bottom: 1px solid var(--border-color);
}
.flow-header-title {
  font-size: 18px;
  font-weight: 700;
  margin-bottom: 6px;
}
.flow-header-desc {
  font-size: 13px;
  color: var(--text-secondary);
  line-height: 1.6;
}
.flow-header-tags {
  display: flex;
  gap: 8px;
  margin-top: 10px;
  flex-wrap: wrap;
}
.flow-tag {
  font-size: 11px;
  padding: 3px 10px;
  border-radius: 10px;
  background: var(--bg-tertiary);
  color: var(--text-secondary);
}

/* 流程图画布 */
.canvas-container {
  flex: 1;
  position: relative;
  overflow: hidden;
  cursor: grab;
}
.canvas-container.dragging { cursor: grabbing; }

.canvas-svg {
  position: absolute;
  top: 0; left: 0;
  transform-origin: 0 0;
}

/* 缩放控制 */
.zoom-controls {
  position: absolute;
  bottom: 20px;
  right: 20px;
  display: flex;
  flex-direction: column;
  gap: 4px;
  z-index: 50;
}
.zoom-btn {
  width: 36px;
  height: 36px;
  border: 1px solid var(--border-color);
  background: var(--bg-secondary);
  color: var(--text-primary);
  border-radius: 6px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
  transition: background 0.15s;
}
.zoom-btn:hover { background: var(--bg-tertiary); }
.zoom-info {
  text-align: center;
  font-size: 11px;
  color: var(--text-muted);
  padding: 4px 0;
}

/* ==================== 节点详情面板 ==================== */
.detail-panel {
  position: fixed;
  top: 56px;
  right: -460px;
  width: 440px;
  height: calc(100vh - 56px);
  background: var(--bg-secondary);
  border-left: 1px solid var(--border-color);
  z-index: 200;
  transition: right 0.35s cubic-bezier(0.4, 0, 0.2, 1);
  display: flex;
  flex-direction: column;
  box-shadow: -8px 0 32px rgba(0,0,0,0.3);
}
.detail-panel.open { right: 0; }

.detail-panel-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 16px 20px;
  border-bottom: 1px solid var(--border-color);
}
.detail-panel-header h3 {
  font-size: 15px;
  font-weight: 600;
}
.detail-close-btn {
  width: 28px;
  height: 28px;
  border: none;
  background: var(--bg-tertiary);
  color: var(--text-primary);
  border-radius: 6px;
  cursor: pointer;
  font-size: 16px;
  display: flex;
  align-items: center;
  justify-content: center;
}
.detail-close-btn:hover { background: var(--bg-surface); }

.detail-panel-body {
  flex: 1;
  overflow-y: auto;
  padding: 20px;
}
.detail-section {
  margin-bottom: 20px;
}
.detail-section-title {
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: var(--text-muted);
  margin-bottom: 8px;
}
.detail-section-content {
  font-size: 13px;
  color: var(--text-secondary);
  line-height: 1.7;
  background: var(--bg-primary);
  padding: 12px 14px;
  border-radius: var(--radius);
  border: 1px solid var(--border-color);
}
.detail-type-badge {
  display: inline-block;
  padding: 3px 10px;
  border-radius: 10px;
  font-size: 12px;
  font-weight: 600;
  color: #1e1e2e;
}
.detail-kv {
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.detail-kv-item {
  display: flex;
  gap: 8px;
}
.detail-kv-key {
  font-size: 12px;
  color: var(--text-muted);
  min-width: 60px;
  flex-shrink: 0;
}
.detail-kv-val {
  font-size: 12px;
  color: var(--text-secondary);
  word-break: break-all;
}
.detail-code {
  font-family: 'Cascadia Code', 'Fira Code', 'Consolas', monospace;
  font-size: 12px;
  color: var(--accent-teal);
  background: rgba(148, 226, 213, 0.08);
  padding: 2px 6px;
  border-radius: 4px;
}

/* 遮罩层 */
.overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.5);
  backdrop-filter: blur(2px);
  z-index: 150;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.35s;
}
.overlay.open {
  opacity: 1;
  pointer-events: auto;
}

/* ==================== SVG 节点样式 ==================== */
.flow-node {
  cursor: pointer;
  transition: filter 0.2s, transform 0.15s;
}
.flow-node:hover {
  filter: brightness(1.2) drop-shadow(0 0 8px rgba(137,180,250,0.3));
}
.flow-node rect, .flow-node polygon {
  transition: stroke-width 0.15s;
}
.flow-node:hover rect, .flow-node:hover polygon {
  stroke-width: 2.5;
}

/* ==================== 决策点说明区域 ==================== */
.decisions-bar {
  padding: 12px 28px;
  background: var(--bg-secondary);
  border-top: 1px solid var(--border-color);
  max-height: 160px;
  overflow-y: auto;
}
.decisions-bar-title {
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: var(--text-muted);
  margin-bottom: 8px;
}
.decisions-list {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}
.decision-chip {
  font-size: 11px;
  padding: 4px 10px;
  background: rgba(243, 139, 168, 0.1);
  border: 1px solid rgba(243, 139, 168, 0.25);
  border-radius: 6px;
  color: var(--accent-red);
  line-height: 1.4;
}

/* ==================== 滚动条 ==================== */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--bg-surface); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }

/* ==================== 响应式 ==================== */
@media (max-width: 900px) {
  .sidebar { width: 220px; min-width: 220px; }
  .detail-panel { width: 340px; right: -360px; }
}
@media (max-width: 640px) {
  .sidebar {
    position: fixed;
    left: -100%;
    top: 56px;
    height: calc(100vh - 56px);
    z-index: 180;
    transition: left 0.3s;
  }
  .sidebar.mobile-open { left: 0; }
  .detail-panel { width: 100%; right: -100%; }
  .mobile-menu-btn { display: flex !important; }
}

/* ==================== 浅色主题 ==================== */
body.theme-light {
  --bg-primary: #ffffff;
  --bg-secondary: #f5f5f7;
  --bg-tertiary: #e5e5ea;
  --bg-surface: #d1d1d6;
  --text-primary: #1d1d1f;
  --text-secondary: #3a3a3c;
  --text-muted: #8e8e93;
  --border-color: #d1d1d6;
  --hover-bg: #e5e5ea;
  --shadow: 0 4px 24px rgba(0,0,0,0.08);
}
body.theme-light .detail-type-badge { color: #fff; }

/* ==================== 顶部工具栏（搜索+操作按钮） ==================== */
.header-tools {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-left: auto;
}
.search-box {
  position: relative;
  width: 240px;
}
.search-box input {
  width: 100%;
  height: 32px;
  padding: 0 32px 0 32px;
  background: var(--bg-tertiary);
  border: 1px solid var(--border-color);
  border-radius: 16px;
  color: var(--text-primary);
  font-size: 12px;
  outline: none;
  transition: border-color 0.2s, box-shadow 0.2s;
}
.search-box input:focus {
  border-color: var(--accent-blue);
  box-shadow: 0 0 0 2px rgba(137,180,250,0.15);
}
.search-box::before {
  content: '🔍';
  position: absolute;
  left: 10px;
  top: 50%;
  transform: translateY(-50%);
  font-size: 12px;
  pointer-events: none;
  opacity: 0.6;
}
.search-results {
  position: absolute;
  top: calc(100% + 6px);
  left: 0;
  right: 0;
  max-height: 360px;
  overflow-y: auto;
  background: var(--bg-secondary);
  border: 1px solid var(--border-color);
  border-radius: 8px;
  box-shadow: var(--shadow);
  z-index: 300;
  display: none;
}
.search-results.open { display: block; }
.search-result-item {
  padding: 10px 14px;
  cursor: pointer;
  border-bottom: 1px solid var(--border-color);
  transition: background 0.15s;
}
.search-result-item:last-child { border-bottom: none; }
.search-result-item:hover { background: var(--hover-bg); }
.search-result-name {
  font-size: 13px;
  color: var(--text-primary);
  font-weight: 600;
}
.search-result-meta {
  font-size: 11px;
  color: var(--text-muted);
  margin-top: 2px;
}
.search-result-empty {
  padding: 16px;
  text-align: center;
  font-size: 12px;
  color: var(--text-muted);
}

.tool-btn {
  width: 32px;
  height: 32px;
  border: 1px solid var(--border-color);
  background: var(--bg-tertiary);
  color: var(--text-primary);
  border-radius: 8px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 14px;
  transition: background 0.15s, transform 0.15s;
}
.tool-btn:hover { background: var(--bg-surface); transform: translateY(-1px); }
.tool-btn:active { transform: translateY(0); }

.mobile-menu-btn { display: none; }

/* ==================== SVG 连线动画 ==================== */
@keyframes dashFlow {
  to { stroke-dashoffset: -20; }
}
.edge-path-dashed {
  animation: dashFlow 1.2s linear infinite;
}
.edge-path { transition: stroke-width 0.2s, stroke-opacity 0.2s; }

/* ==================== SVG 节点高亮联动 ==================== */
.flow-node.dimmed { opacity: 0.25; }
.flow-node.highlighted rect, .flow-node.highlighted polygon {
  stroke-width: 3 !important;
  filter: drop-shadow(0 0 10px rgba(137,180,250,0.6));
}
.edge-path.dimmed { stroke-opacity: 0.1 !important; }
.edge-path.highlighted { stroke-opacity: 0.95 !important; stroke-width: 2.5 !important; }

/* ==================== 详情面板增强 ==================== */
.detail-nav-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 20px;
  background: var(--bg-tertiary);
  border-bottom: 1px solid var(--border-color);
}
.detail-nav-btn {
  padding: 5px 12px;
  background: var(--bg-secondary);
  border: 1px solid var(--border-color);
  color: var(--text-primary);
  border-radius: 6px;
  font-size: 11px;
  cursor: pointer;
  transition: all 0.15s;
}
.detail-nav-btn:hover:not(:disabled) {
  background: var(--bg-surface);
  border-color: var(--accent-blue);
}
.detail-nav-btn:disabled {
  opacity: 0.4;
  cursor: not-allowed;
}
.detail-nav-progress {
  font-size: 11px;
  color: var(--text-muted);
}

/* 可复制代码块 */
.detail-code.copyable {
  cursor: pointer;
  position: relative;
  user-select: all;
  transition: background 0.15s;
}
.detail-code.copyable:hover {
  background: rgba(148, 226, 213, 0.18);
}
.detail-code.copied::after {
  content: '✓ 已复制';
  position: absolute;
  top: -24px;
  right: 0;
  background: var(--accent-green);
  color: #1e1e2e;
  font-size: 10px;
  padding: 2px 8px;
  border-radius: 4px;
  font-weight: 600;
}

/* ==================== 快捷键提示 ==================== */
.shortcut-hint {
  position: fixed;
  bottom: 16px;
  left: 296px;
  padding: 6px 12px;
  background: var(--bg-secondary);
  border: 1px solid var(--border-color);
  border-radius: 6px;
  font-size: 11px;
  color: var(--text-muted);
  z-index: 30;
  pointer-events: none;
  opacity: 0.7;
  display: flex;
  gap: 12px;
}
.shortcut-hint kbd {
  padding: 1px 6px;
  background: var(--bg-tertiary);
  border: 1px solid var(--border-color);
  border-radius: 3px;
  font-family: 'Cascadia Code', monospace;
  font-size: 10px;
  color: var(--text-secondary);
}
@media (max-width: 900px) {
  .shortcut-hint { display: none; }
}

/* ==================== 加载淡入动画 ==================== */
@keyframes fadeInUp {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}
.canvas-svg { animation: fadeInUp 0.4s ease; }

/* ==================== 链路头部统计 ==================== */
.flow-header-stats {
  display: flex;
  gap: 12px;
  margin-top: 10px;
  flex-wrap: wrap;
}
.stat-chip {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 11px;
  padding: 3px 10px;
  background: var(--bg-tertiary);
  border-radius: 10px;
  color: var(--text-secondary);
}
.stat-chip-dot {
  width: 8px;
  height: 8px;
  border-radius: 2px;
}
</style>
</head>
<body>

<!-- ==================== 顶部标题栏 ==================== -->
<header class="header">
  <button class="tool-btn mobile-menu-btn" onclick="toggleMobileSidebar()" title="菜单">☰</button>
  <div class="header-logo">⚡ Ragent</div>
  <div class="header-divider"></div>
  <div class="header-title">业务链路流程分析</div>
  <div class="header-tools">
    <div class="search-box">
      <input type="text" id="search-input" placeholder="搜索节点（名称/类名）..." autocomplete="off" />
      <div class="search-results" id="search-results"></div>
    </div>
    <button class="tool-btn" onclick="toggleTheme()" title="切换主题" id="theme-btn">🌙</button>
    <button class="tool-btn" onclick="toggleFullscreen()" title="全屏 (F11)">⛶</button>
    <button class="tool-btn" onclick="exportSVG()" title="导出 SVG">⬇</button>
  </div>
  <div class="header-badge" id="global-stats-badge">加载中...</div>
</header>

<!-- ==================== 主布局 ==================== -->
<div class="main-layout">
  <!-- 左侧导航 -->
  <aside class="sidebar">
    <div class="sidebar-section-title">核心链路</div>
    <div id="nav-container"></div>
    <!-- 图例 -->
    <div class="legend">
      <div class="legend-title">节点类型图例</div>
      <div class="legend-item"><span class="legend-dot" style="background:var(--node-user)"></span>用户交互</div>
      <div class="legend-item"><span class="legend-dot" style="background:var(--node-data)"></span>数据处理</div>
      <div class="legend-item"><span class="legend-dot" style="background:var(--node-ai)"></span>AI / LLM 调用</div>
      <div class="legend-item"><span class="legend-dot" style="background:var(--node-storage)"></span>存储 / 数据库</div>
      <div class="legend-item"><span class="legend-dot" style="background:var(--node-decision)"></span>决策 / 分支</div>
      <div class="legend-item"><span class="legend-dot" style="background:var(--node-async)"></span>异步处理</div>
    </div>
  </aside>

  <!-- 右侧内容 -->
  <div class="content">
    <div class="flow-header" id="flow-header"></div>
    <div class="canvas-container" id="canvas-container">
      <svg class="canvas-svg" id="canvas-svg"></svg>
      <div class="zoom-controls">
        <button class="zoom-btn" onclick="zoomIn()" title="放大">＋</button>
        <div class="zoom-info" id="zoom-info">100%</div>
        <button class="zoom-btn" onclick="zoomOut()" title="缩小">－</button>
        <button class="zoom-btn" onclick="zoomReset()" title="重置" style="font-size:13px;margin-top:4px;">⟲</button>
      </div>
    </div>
    <div class="decisions-bar" id="decisions-bar" style="display:none"></div>
  </div>
</div>

<!-- 遮罩 -->
<div class="overlay" id="overlay" onclick="closeDetailPanel()"></div>

<!-- 节点详情面板 -->
<div class="detail-panel" id="detail-panel">
  <div class="detail-panel-header">
    <h3 id="detail-title">节点详情</h3>
    <button class="detail-close-btn" onclick="closeDetailPanel()">✕</button>
  </div>
  <div class="detail-nav-bar">
    <button class="detail-nav-btn" id="detail-prev-btn" onclick="navigateNode(-1)">← 上一步</button>
    <span class="detail-nav-progress" id="detail-progress">1 / 1</span>
    <button class="detail-nav-btn" id="detail-next-btn" onclick="navigateNode(1)">下一步 →</button>

// 当前选中的链路索引
let currentFlowIndex = 0;

// 画布状态
let scale = 1;
let translateX = 0;
let translateY = 0;
let isDragging = false;
let dragStartX = 0;
let dragStartY = 0;

function getFlowStats() {
  return FLOWS.reduce((stats, flow) => {
    stats.flowCount += 1;
    stats.nodeCount += Array.isArray(flow.nodes) ? flow.nodes.length : 0;
    return stats;
  }, { flowCount: 0, nodeCount: 0 });
}

function updateGlobalStats() {
  const { flowCount, nodeCount } = getFlowStats();
  const badge = document.getElementById('global-stats-badge');
  if (badge) {
    badge.textContent = `v1.5 · ${flowCount} 条核心链路 · ${nodeCount} 个节点`;
  }
}

function formatDecision(decision) {
  if (typeof decision === 'string') {
    return decision;
  }
  if (!decision || typeof decision !== 'object') {
    return '';
  }

  const condition = decision.condition ? `条件：${decision.condition}` : '';
  const branch = decision.branch ? `分支：${decision.branch}` : '';
  const action = decision.action ? `动作：${decision.action}` : '';

  return [condition, branch, action].filter(Boolean).join(' ｜ ');
}

  const container = document.getElementById('canvas-container');

  const svgH = parseFloat(svg.getAttribute('height')) || 1;
  const cw = container.clientWidth;
  const ch = container.clientHeight;
  const scaleX = cw / (svgW + 40);
  const scaleY = ch / (svgH + 40);
  scale = Math.min(1, scaleX, scaleY);
  translateX = Math.max(10, (cw - svgW * scale) / 2);
  translateY = Math.max(10, (ch - svgH * scale) / 2);
  updateTransform();
}

// ==================== 渲染决策点 ====================
function renderDecisions() {
  const flow = FLOWS[currentFlowIndex];
  const bar = document.getElementById('decisions-bar');
  if (!flow.decisions || flow.decisions.length === 0) {
    bar.style.display = 'none';
    return;
  }

  const decisionItems = flow.decisions
    .map(formatDecision)
    .filter(Boolean);

  if (decisionItems.length === 0) {
    bar.style.display = 'none';
    return;
  }

  bar.style.display = 'block';
  bar.innerHTML = `
    <div class="decisions-bar-title">关键决策点</div>
    <div class="decisions-list">${decisionItems.map(d => `<span class="decision-chip">⚡ ${d}</span>`).join('')}</div>
  `;
}

/* ====================================================================================
 *  SVG 流程图绘制
 * ==================================================================================== */

// 节点尺寸常量
const NODE_W = 180;
const NODE_H = 52;
const NODE_GAP_X = 60;
const NODE_GAP_Y = 80;
const PADDING_X = 60;
const PADDING_Y = 40;

/**
 * 计算节点布局位置
 * 链路1（qa）：12个节点，4列3行
 * 链路4（memory）：有并行分支（3a, 3b），特殊布局
 * 链路5（routing）：有分支，特殊布局
 * 其余：线性排列，每行4个节点
 */
function computeLayout(flow) {
  const nodes = flow.nodes;
  const positions = [];

  if (flow.id === 'qa') {
    // 智能问答：显式展示歧义引导、SYSTEM直答、KB/MCP并行与空结果兜底
    const layoutMap = {
      'qa-1':  { col: 0, row: 1 },
      'qa-2':  { col: 1, row: 1 },
      'qa-3':  { col: 2, row: 1 },
      'qa-4':  { col: 3, row: 1 },
      'qa-5':  { col: 4, row: 1 },
      'qa-6':  { col: 5, row: 1 },
      'qa-6a': { col: 5, row: 0 },
      'qa-7':  { col: 6, row: 1 },
      'qa-8':  { col: 7, row: 2 },
      'qa-9':  { col: 7, row: 3 },
      'qa-10': { col: 8, row: 2 },
      'qa-11': { col: 8, row: 1 },
      'qa-12': { col: 8, row: 0 },
      'qa-13': { col: 9, row: 1 },
      'qa-14': { col: 10, row: 1 },
      'qa-15': { col: 11, row: 1 }
    };

    nodes.forEach((node, i) => {
      const preset = layoutMap[node.id] || { col: i, row: 1 };
      positions.push({
        x: PADDING_X + preset.col * (NODE_W + NODE_GAP_X),
        y: PADDING_Y + preset.row * (NODE_H + NODE_GAP_Y),
        node
      });
    });
  } else if (flow.id === 'memory') {
    // 会话记忆：mm-1, mm-2线性，然后mm-3a和mm-3b并行，之后继续线性
    const col0X = PADDING_X;
    const col1X = PADDING_X + NODE_W + NODE_GAP_X;
    const col2X = PADDING_X + 2 * (NODE_W + NODE_GAP_X);
    const col3X = PADDING_X + 3 * (NODE_W + NODE_GAP_X);

    // 第0行：mm-1, mm-2
    positions.push({ x: col0X, y: PADDING_Y, node: nodes[0] }); // mm-1
    positions.push({ x: col1X, y: PADDING_Y, node: nodes[1] }); // mm-2

    // 第1行：mm-3a, mm-3b（并行）
    const row1Y = PADDING_Y + NODE_H + NODE_GAP_Y;
    positions.push({ x: col0X + 40, y: row1Y, node: nodes[2] }); // mm-3a
    positions.push({ x: col1X + 100, y: row1Y, node: nodes[3] }); // mm-3b

    // 第2行：mm-4, mm-5, mm-6, mm-7
    const row2Y = row1Y + NODE_H + NODE_GAP_Y;
    positions.push({ x: col0X, y: row2Y, node: nodes[4] });
    positions.push({ x: col1X, y: row2Y, node: nodes[5] });
    positions.push({ x: col2X, y: row2Y, node: nodes[6] });
    positions.push({ x: col3X, y: row2Y, node: nodes[7] });

    // 第3行：mm-8, mm-9, mm-10
    const row3Y = row2Y + NODE_H + NODE_GAP_Y;
    positions.push({ x: col0X, y: row3Y, node: nodes[8] });
    positions.push({ x: col1X, y: row3Y, node: nodes[9] });
    positions.push({ x: col2X, y: row3Y, node: nodes[10] });

  } else if (flow.id === 'routing') {
    // 模型路由：有分支结构
    const col0X = PADDING_X;
    const col1X = PADDING_X + NODE_W + NODE_GAP_X;
    const col2X = PADDING_X + 2 * (NODE_W + NODE_GAP_X);
    const col3X = PADDING_X + 3 * (NODE_W + NODE_GAP_X);

    // 第0行：rt-1, rt-2, rt-3, rt-4
    const r0 = PADDING_Y;
    positions.push({ x: col0X, y: r0, node: nodes[0] });
    positions.push({ x: col1X, y: r0, node: nodes[1] });
    positions.push({ x: col2X, y: r0, node: nodes[2] });
    positions.push({ x: col3X, y: r0, node: nodes[3] });

    // 第1行：rt-4a, rt-4b, rt-4c（三个状态分支）
    const r1 = r0 + NODE_H + NODE_GAP_Y;
    positions.push({ x: col0X, y: r1, node: nodes[4] });  // 4a OPEN
    positions.push({ x: col1X, y: r1, node: nodes[5] });  // 4b HALF_OPEN
    positions.push({ x: col2X, y: r1, node: nodes[6] });  // 4c CLOSED

    // 第2行：rt-5, rt-6a, rt-6b
    const r2 = r1 + NODE_H + NODE_GAP_Y;
    positions.push({ x: col1X, y: r2, node: nodes[7] });  // rt-5
    positions.push({ x: col2X, y: r2, node: nodes[8] });  // rt-6a
    positions.push({ x: col3X, y: r2, node: nodes[9] });  // rt-6b

    // 第3行：rt-7, rt-8
    const r3 = r2 + NODE_H + NODE_GAP_Y;
    positions.push({ x: col2X, y: r3, node: nodes[10] }); // rt-7
    positions.push({ x: col3X, y: r3, node: nodes[11] }); // rt-8

  } else {
    // 默认线性布局：每行4个
    const cols = 4;
    nodes.forEach((node, i) => {
      const col = i % cols;
      const row = Math.floor(i / cols);
      positions.push({
        x: PADDING_X + col * (NODE_W + NODE_GAP_X),
        y: PADDING_Y + row * (NODE_H + NODE_GAP_Y),
        node
      });
    });
  }

  return positions;
}

/**
 * 计算连线数据
 */
function computeEdges(flow, positions) {
  const edges = [];
  const posMap = {};
  positions.forEach((p, i) => { posMap[p.node.id] = { ...p, index: i }; });

  if (flow.id === 'qa') {
    // qa-1 → qa-6 主干
    edges.push({ from: posMap['qa-1'].index, to: posMap['qa-2'].index });
    edges.push({ from: posMap['qa-2'].index, to: posMap['qa-3'].index });
    edges.push({ from: posMap['qa-3'].index, to: posMap['qa-4'].index });
    edges.push({ from: posMap['qa-4'].index, to: posMap['qa-5'].index });
    edges.push({ from: posMap['qa-5'].index, to: posMap['qa-6'].index });

    // 歧义引导：提前结束
    edges.push({ from: posMap['qa-6'].index, to: posMap['qa-6a'].index, label: 'PROMPT', style: 'dashed' });

    // 明确意图：继续进入分支判断
    edges.push({ from: posMap['qa-6'].index, to: posMap['qa-7'].index, label: 'NONE' });

    // SYSTEM 直答
    edges.push({ from: posMap['qa-7'].index, to: posMap['qa-13'].index, label: 'SYSTEM' });

    // RETRIEVAL 分支：KB 与 MCP 分别构建上下文后汇合
    edges.push({ from: posMap['qa-7'].index, to: posMap['qa-8'].index, label: 'KB' });
    edges.push({ from: posMap['qa-7'].index, to: posMap['qa-9'].index, label: 'MCP' });
    edges.push({ from: posMap['qa-8'].index, to: posMap['qa-10'].index });
    edges.push({ from: posMap['qa-9'].index, to: posMap['qa-10'].index });

    // 结果判空
    edges.push({ from: posMap['qa-10'].index, to: posMap['qa-11'].index });
    edges.push({ from: posMap['qa-11'].index, to: posMap['qa-12'].index, label: 'EMPTY', style: 'dashed' });
    edges.push({ from: posMap['qa-11'].index, to: posMap['qa-13'].index, label: 'CONTINUE' });

    // 消息组装 → 流式输出 → 后处理
    edges.push({ from: posMap['qa-13'].index, to: posMap['qa-14'].index });
    edges.push({ from: posMap['qa-14'].index, to: posMap['qa-15'].index });
  } else if (flow.id === 'memory') {
    // mm-1→mm-2
    edges.push({ from: 0, to: 1 });
    // mm-2→mm-3a（并行）, mm-2→mm-3b（并行）
    edges.push({ from: 1, to: 2, label: '并行' });
    edges.push({ from: 1, to: 3, label: '并行' });
    // mm-3a→mm-4, mm-3b→mm-4
    edges.push({ from: 2, to: 4 });
    edges.push({ from: 3, to: 4 });
    // mm-4→mm-5→mm-6→mm-7
    edges.push({ from: 4, to: 5 });
    edges.push({ from: 5, to: 6 });
    edges.push({ from: 6, to: 7 });
    // mm-7→mm-8→mm-9→mm-10
    edges.push({ from: 7, to: 8 });
    edges.push({ from: 8, to: 9 });
    edges.push({ from: 9, to: 10, label: '≥5轮' });
  } else if (flow.id === 'routing') {
    // rt-1→rt-2→rt-3→rt-4
    edges.push({ from: 0, to: 1 });
    edges.push({ from: 1, to: 2 });
    edges.push({ from: 2, to: 3 });
    // rt-4→三个分支 4a, 4b, 4c
    edges.push({ from: 3, to: 4, label: 'OPEN' });
    edges.push({ from: 3, to: 5, label: 'HALF_OPEN' });
    edges.push({ from: 3, to: 6, label: 'CLOSED' });
    // 4a→回到rt-3（遍历下一个）
    edges.push({ from: 4, to: 2, label: '下一个', style: 'dashed' });
    // 4b→rt-5, 4c→rt-5
    edges.push({ from: 5, to: 7 });
    edges.push({ from: 6, to: 7 });
    // rt-5→rt-6a（成功）, rt-5→rt-6b（失败）
    edges.push({ from: 7, to: 8, label: '成功' });
    edges.push({ from: 7, to: 9, label: '失败' });
    // rt-6b→rt-7
    edges.push({ from: 9, to: 10 });
    // rt-7→rt-3（回去重试）
    edges.push({ from: 10, to: 2, label: '重试', style: 'dashed' });
    // rt-7→rt-8（熔断）
    edges.push({ from: 10, to: 11, label: '全部失败' });
  } else {
    // 线性连接
    for (let i = 0; i < positions.length - 1; i++) {
      edges.push({ from: i, to: i + 1 });
    }
  }

  return edges;
}

/**
 * 渲染流程图 SVG
 */
function renderFlowDiagram() {
  const flow = FLOWS[currentFlowIndex];
  const positions = computeLayout(flow);
  const edges = computeEdges(flow, positions);

  // 计算SVG尺寸
  let maxX = 0, maxY = 0;
  positions.forEach(p => {
    if (p.x + NODE_W > maxX) maxX = p.x + NODE_W;
    if (p.y + NODE_H > maxY) maxY = p.y + NODE_H;
  });
  const svgW = maxX + PADDING_X * 2;
  const svgH = maxY + PADDING_Y * 2;

  const svg = document.getElementById('canvas-svg');
  svg.setAttribute('width', svgW);
  svg.setAttribute('height', svgH);

  let html = '';

  // 定义箭头标记
  html += `
    <defs>
      <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto" fill="var(--text-muted)">
        <polygon points="0 0, 10 3.5, 0 7" />
      </marker>
      <marker id="arrowhead-dashed" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto" fill="var(--accent-red)" opacity="0.6">
        <polygon points="0 0, 10 3.5, 0 7" />
      </marker>
    </defs>
  `;

  // 绘制连线
  edges.forEach(edge => {
    const from = positions[edge.from];
    const to = positions[edge.to];
    const isDashed = edge.style === 'dashed';

    // 计算起终点（从节点边缘出发）
    let x1, y1, x2, y2;
    const fromCX = from.x + NODE_W / 2;
    const fromCY = from.y + NODE_H / 2;
    const toCX = to.x + NODE_W / 2;
    const toCY = to.y + NODE_H / 2;

    // 确定连接方向
    const dx = toCX - fromCX;
    const dy = toCY - fromCY;

    if (Math.abs(dx) > Math.abs(dy)) {
      // 水平方向为主
      if (dx > 0) {
        x1 = from.x + NODE_W; y1 = fromCY;
        x2 = to.x; y2 = toCY;
      } else {
        x1 = from.x; y1 = fromCY;
        x2 = to.x + NODE_W; y2 = toCY;
      }
    } else {
      // 垂直方向为主
      if (dy > 0) {
        x1 = fromCX; y1 = from.y + NODE_H;
        x2 = toCX; y2 = to.y;
      } else {
        x1 = fromCX; y1 = from.y;
        x2 = toCX; y2 = to.y + NODE_H;
      }
    }

    // 贝塞尔曲线中点
    const midX = (x1 + x2) / 2;
    const midY = (y1 + y2) / 2;

    // 根据方向生成曲线
    let pathD;
    if (Math.abs(dx) > Math.abs(dy)) {
      pathD = `M${x1},${y1} C${x1 + (x2 - x1) * 0.4},${y1} ${x2 - (x2 - x1) * 0.4},${y2} ${x2},${y2}`;
    } else {
      pathD = `M${x1},${y1} C${x1},${y1 + (y2 - y1) * 0.4} ${x2},${y2 - (y2 - y1) * 0.4} ${x2},${y2}`;
    }

    const markerEnd = isDashed ? 'url(#arrowhead-dashed)' : 'url(#arrowhead)';
    const strokeColor = isDashed ? 'var(--accent-red)' : 'var(--text-muted)';
    const strokeOpacity = isDashed ? '0.5' : '0.5';
    const dashArray = isDashed ? '6,4' : 'none';
    const edgeClass = isDashed ? 'edge-path edge-path-dashed' : 'edge-path';

    html += `<path class="${edgeClass}" data-from="${edge.from}" data-to="${edge.to}" 
              d="${pathD}" fill="none" stroke="${strokeColor}" stroke-width="1.5" 
              stroke-opacity="${strokeOpacity}" stroke-dasharray="${dashArray}" 
              marker-end="${markerEnd}" />`;

    // 绘制标签
    if (edge.label) {
      const labelBg = isDashed ? 'rgba(243,139,168,0.12)' : 'rgba(108,112,134,0.15)';
      const labelColor = isDashed ? 'var(--accent-red)' : 'var(--text-muted)';
      const textLen = edge.label.length * 7 + 12;
      html += `<rect x="${midX - textLen/2}" y="${midY - 16}" width="${textLen}" height="16" rx="4" fill="${labelBg}" />`;
      html += `<text x="${midX}" y="${midY - 5}" text-anchor="middle" fill="${labelColor}" 
                font-size="10" font-weight="500">${edge.label}</text>`;
    }
  });

  // 绘制节点
  positions.forEach((pos, idx) => {
    const node = pos.node;
    const typeInfo = NODE_TYPES[node.type];
    const color = typeInfo.color;
    const bgColor = color + '1a'; // 10% 透明度

    // 决策节点用菱形效果（圆角矩形+斜角背景区分即可，真菱形在小尺寸可读性不好）
    // 统一使用圆角矩形但配色不同
    const rx = node.type === 'decision' ? 4 : 8;

    html += `
      <g class="flow-node" data-idx="${idx}" 
         onclick="showNodeDetail('${node.id}')" 
         onmouseenter="highlightNode(${idx}, true)"
         onmouseleave="highlightNode(${idx}, false)"
         transform="translate(${pos.x}, ${pos.y})">
        <title>${node.name} · ${typeInfo.label}${node.javaClass ? ' · ' + node.javaClass : ''}</title>
        <rect width="${NODE_W}" height="${NODE_H}" rx="${rx}" ry="${rx}" 
              fill="${bgColor}" stroke="${color}" stroke-width="1.5" />
        <line x1="0" y1="26" x2="${NODE_W}" y2="26" stroke="${color}" stroke-opacity="0.15" stroke-width="1" />
        <text x="${NODE_W / 2}" y="18" text-anchor="middle" fill="${color}" 
              font-size="12" font-weight="700">${truncateText(node.name, 14)}</text>
        <text x="${NODE_W / 2}" y="40" text-anchor="middle" fill="var(--text-muted)" 
              font-size="10">${typeInfo.label}</text>
        <circle cx="${NODE_W - 14}" cy="12" r="8" fill="${color}" opacity="0.2" />
        <text x="${NODE_W - 14}" y="15.5" text-anchor="middle" fill="${color}" 
              font-size="9" font-weight="600">${idx + 1}</text>
      </g>
    `;
  });

  svg.innerHTML = html;
}

// ==================== 文本截断 ====================
function truncateText(text, maxLen) {
  return text.length > maxLen ? text.substring(0, maxLen - 1) + '…' : text;
}

/* ====================================================================================
 *  缩放与拖拽
 * ==================================================================================== */

function updateTransform() {
  const svg = document.getElementById('canvas-svg');
  svg.style.transform = `translate(${translateX}px, ${translateY}px) scale(${scale})`;
  document.getElementById('zoom-info').textContent = Math.round(scale * 100) + '%';
}

function zoomIn() {
  scale = Math.min(scale + 0.15, 3);
  updateTransform();
}

function zoomOut() {
  scale = Math.max(scale - 0.15, 0.3);
  updateTransform();
}

function zoomReset() {
  scale = 1;
  translateX = 0;
  translateY = 0;
  updateTransform();
}

// 鼠标滚轮缩放
const canvasContainer = document.getElementById('canvas-container');

canvasContainer.addEventListener('wheel', function(e) {
  e.preventDefault();
  const delta = e.deltaY > 0 ? -0.08 : 0.08;
  const newScale = Math.max(0.3, Math.min(3, scale + delta));

  // 以鼠标位置为中心缩放
  const rect = canvasContainer.getBoundingClientRect();
  const mouseX = e.clientX - rect.left;
  const mouseY = e.clientY - rect.top;

  // 调整位移以鼠标为中心
  translateX = mouseX - (mouseX - translateX) * (newScale / scale);
  translateY = mouseY - (mouseY - translateY) * (newScale / scale);

  scale = newScale;
  updateTransform();
}, { passive: false });

// 拖拽
canvasContainer.addEventListener('mousedown', function(e) {
  if (e.target.closest('.flow-node')) return; // 不拦截节点点击
  isDragging = true;
  dragStartX = e.clientX - translateX;
  dragStartY = e.clientY - translateY;
  canvasContainer.classList.add('dragging');
});

document.addEventListener('mousemove', function(e) {
  if (!isDragging) return;
  translateX = e.clientX - dragStartX;
  translateY = e.clientY - dragStartY;
  updateTransform();
});

document.addEventListener('mouseup', function() {
  isDragging = false;
  canvasContainer.classList.remove('dragging');
});

/* ====================================================================================
 *  节点详情面板
 * ==================================================================================== */

// 当前详情面板节点索引
let currentNodeIndex = -1;

function showNodeDetail(nodeId) {
  const flow = FLOWS[currentFlowIndex];
  if (!flow) return;
  const nodeIndex = flow.nodes.findIndex(n => n.id === nodeId);
  if (nodeIndex < 0) return;
  const node = flow.nodes[nodeIndex];
  currentNodeIndex = nodeIndex;

  const typeInfo = NODE_TYPES[node.type];
  const panel = document.getElementById('detail-panel');
  const overlay = document.getElementById('overlay');

  document.getElementById('detail-title').textContent = node.name;

  // 更新导航进度和按钮状态
  document.getElementById('detail-progress').textContent = `${nodeIndex + 1} / ${flow.nodes.length}`;
  document.getElementById('detail-prev-btn').disabled = (nodeIndex === 0);
  document.getElementById('detail-next-btn').disabled = (nodeIndex === flow.nodes.length - 1);

  let bodyHTML = '';

  // 类型标记 + 位置信息
  bodyHTML += `
    <div class="detail-section">
      <div class="detail-section-title">节点信息</div>
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;">
        <span class="detail-type-badge" style="background:${typeInfo.color}">${typeInfo.label}</span>
        <span style="font-size:12px;color:var(--text-muted);">第 ${nodeIndex + 1} / ${flow.nodes.length} 步 · ${flow.title}</span>
      </div>
    </div>
  `;

  // Java类（可复制）
  if (node.javaClass) {
    bodyHTML += `
      <div class="detail-section">
        <div class="detail-section-title">对应 Java 类 / 方法（点击复制）</div>
        <div class="detail-section-content">
          <span class="detail-code copyable" onclick="copyText(this, '${node.javaClass.replace(/'/g, "\\'")}')">${node.javaClass}</span>
        </div>
      </div>
    `;
  }

  // 功能描述
  bodyHTML += `
    <div class="detail-section">
      <div class="detail-section-title">功能描述</div>
      <div class="detail-section-content">${node.desc || '—'}</div>
    </div>
  `;

  // 输入/输出
  if (node.input || node.output) {
    bodyHTML += `
      <div class="detail-section">
        <div class="detail-section-title">输入 / 输出</div>
        <div class="detail-section-content detail-kv">
          ${node.input ? `<div class="detail-kv-item"><span class="detail-kv-key">📥 输入</span><span class="detail-kv-val">${node.input}</span></div>` : ''}
          ${node.output ? `<div class="detail-kv-item"><span class="detail-kv-key">📤 输出</span><span class="detail-kv-val">${node.output}</span></div>` : ''}
        </div>
      </div>
    `;
  }

  // 配置
  if (node.config) {
    bodyHTML += `
      <div class="detail-section">
        <div class="detail-section-title">关键配置参数</div>
        <div class="detail-section-content"><span class="detail-code copyable" onclick="copyText(this, '${node.config.replace(/'/g, "\\'")}')">${node.config}</span></div>
      </div>
    `;
  }

  // 异常处理
  if (node.error) {
    bodyHTML += `
      <div class="detail-section">
        <div class="detail-section-title">异常处理</div>
        <div class="detail-section-content" style="border-color:rgba(243,139,168,0.3);color:var(--accent-red);">${node.error}</div>
      </div>
    `;
  }

  const detail = node.detail || {};

  if (Array.isArray(detail.eventSequence) && detail.eventSequence.length > 0) {
    bodyHTML += `
      <div class="detail-section">
        <div class="detail-section-title">真实事件序列</div>
        <div class="detail-section-content detail-kv">
          ${detail.eventSequence.map((item, idx) => `
            <div class="detail-kv-item" style="display:block;">
              <div style="font-weight:600;margin-bottom:6px;color:var(--text-main);">${idx + 1}. ${item.title || '未命名事件'}</div>
              ${item.method ? `<div style="margin-bottom:6px;"><span class="detail-kv-key">方法</span><span class="detail-kv-val"><span class="detail-code copyable" onclick="copyText(this, '${String(item.method).replace(/'/g, "\\'")}')">${item.method}</span></span></div>` : ''}
              ${item.write ? `<div style="margin-bottom:6px;"><span class="detail-kv-key">写入</span><span class="detail-kv-val">${item.write}</span></div>` : ''}
              ${item.note ? `<div><span class="detail-kv-key">说明</span><span class="detail-kv-val">${item.note}</span></div>` : ''}
            </div>
          `).join('')}
        </div>
      </div>
    `;
  }

  if (Array.isArray(detail.coveredMethods) && detail.coveredMethods.length > 0) {
    bodyHTML += `
      <div class="detail-section">
        <div class="detail-section-title">实际覆盖方法</div>
        <div class="detail-section-content" style="display:flex;flex-direction:column;gap:8px;">
          ${detail.coveredMethods.map(method => `<span class="detail-code copyable" onclick="copyText(this, '${String(method).replace(/'/g, "\\'")}')">${method}</span>`).join('')}
        </div>
      </div>
    `;
  }

  if (Array.isArray(detail.implementationNotes) && detail.implementationNotes.length > 0) {
    bodyHTML += `
      <div class="detail-section">
        <div class="detail-section-title">实现口径说明</div>
        <div class="detail-section-content detail-kv">
          ${detail.implementationNotes.map(item => `
            <div class="detail-kv-item">
              <span class="detail-kv-key">${item.key || '说明'}</span>
              <span class="detail-kv-val">${item.value || '—'}</span>
            </div>
          `).join('')}
        </div>
      </div>
    `;
  }

  document.getElementById('detail-body').innerHTML = bodyHTML;
  panel.classList.add('open');
  overlay.classList.add('open');

  // 联动高亮
  highlightNode(nodeIndex, true, true);
}

// 上一步/下一步
function navigateNode(delta) {
  const flow = FLOWS[currentFlowIndex];
  if (!flow) return;
  const next = currentNodeIndex + delta;
  if (next < 0 || next >= flow.nodes.length) return;
  showNodeDetail(flow.nodes[next].id);
}

// 文本复制
function copyText(el, text) {
  navigator.clipboard.writeText(text).then(() => {
    el.classList.add('copied');
    setTimeout(() => el.classList.remove('copied'), 1500);
  }).catch(() => {
    // 降级
    const ta = document.createElement('textarea');
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); } catch (e) {}
    document.body.removeChild(ta);
    el.classList.add('copied');
    setTimeout(() => el.classList.remove('copied'), 1500);
  });
}

function closeDetailPanel() {
  document.getElementById('detail-panel').classList.remove('open');
  document.getElementById('overlay').classList.remove('open');
  // 清除高亮
  clearHighlight();
  currentNodeIndex = -1;
}

/* ====================================================================================
 *  节点高亮联动
 * ==================================================================================== */
function highlightNode(idx, on, persist = false) {
  const svg = document.getElementById('canvas-svg');
  const nodes = svg.querySelectorAll('.flow-node');
  const edges = svg.querySelectorAll('.edge-path');

  if (!on && !persist) {
    clearHighlight();
    return;
  }

  // 找出与当前节点相关的连线
  const relatedEdgeIdx = new Set();
  const relatedNodeIdx = new Set([idx]);
  edges.forEach(edge => {
    const from = parseInt(edge.getAttribute('data-from'));
    const to = parseInt(edge.getAttribute('data-to'));
    if (from === idx || to === idx) {
      relatedEdgeIdx.add(edge);
      relatedNodeIdx.add(from);
      relatedNodeIdx.add(to);
    }
  });

  nodes.forEach(n => {
    const nIdx = parseInt(n.getAttribute('data-idx'));
    n.classList.remove('dimmed', 'highlighted');
    if (relatedNodeIdx.has(nIdx)) {
      if (nIdx === idx) n.classList.add('highlighted');
    } else {
      n.classList.add('dimmed');
    }
  });
  edges.forEach(e => {
    e.classList.remove('dimmed', 'highlighted');
    if (relatedEdgeIdx.has(e)) e.classList.add('highlighted');
    else e.classList.add('dimmed');
  });
}

function clearHighlight() {
  const svg = document.getElementById('canvas-svg');
  svg.querySelectorAll('.flow-node').forEach(n => n.classList.remove('dimmed', 'highlighted'));
  svg.querySelectorAll('.edge-path').forEach(e => e.classList.remove('dimmed', 'highlighted'));
}

/* ====================================================================================
 *  搜索功能
 * ==================================================================================== */
function initSearch() {
  const input = document.getElementById('search-input');
  const results = document.getElementById('search-results');

  input.addEventListener('input', () => {
    const q = input.value.trim().toLowerCase();
    if (!q) { results.classList.remove('open'); return; }

    const matches = [];
    FLOWS.forEach((flow, fi) => {
      flow.nodes.forEach((node, ni) => {
        const hay = (node.name + ' ' + (node.javaClass || '') + ' ' + (node.desc || '')).toLowerCase();
        if (hay.includes(q)) {
          matches.push({ flow, flowIdx: fi, node, nodeIdx: ni });
        }
      });
    });

    if (matches.length === 0) {
      results.innerHTML = '<div class="search-result-empty">未找到匹配节点</div>';
    } else {
      results.innerHTML = matches.slice(0, 20).map(m => `
        <div class="search-result-item" onclick="jumpToNode(${m.flowIdx}, '${m.node.id}')">
          <div class="search-result-name">${m.node.name}</div>
          <div class="search-result-meta">${m.flow.icon} ${m.flow.title} · ${m.node.javaClass || NODE_TYPES[m.node.type].label}</div>
        </div>
      `).join('');
    }
    results.classList.add('open');
  });

  input.addEventListener('blur', () => {
    setTimeout(() => results.classList.remove('open'), 200);
  });
  input.addEventListener('focus', () => {
    if (input.value.trim()) results.classList.add('open');
  });
}

function jumpToNode(flowIdx, nodeId) {
  if (flowIdx !== currentFlowIndex) {
    selectFlow(flowIdx);
    setTimeout(() => showNodeDetail(nodeId), 300);
  } else {
    showNodeDetail(nodeId);
  }
  document.getElementById('search-input').value = '';
  document.getElementById('search-results').classList.remove('open');
}

/* ====================================================================================
 *  主题切换 / 全屏 / 导出 / 移动端
 * ==================================================================================== */
function toggleTheme() {
  document.body.classList.toggle('theme-light');
  const isLight = document.body.classList.contains('theme-light');
  document.getElementById('theme-btn').textContent = isLight ? '☀️' : '🌙';
  try { localStorage.setItem('ragent-flow-theme', isLight ? 'light' : 'dark'); } catch (e) {}
}

function toggleFullscreen() {
  if (!document.fullscreenElement) {
    document.documentElement.requestFullscreen().catch(() => {});
  } else {
    document.exitFullscreen();
  }
}

function exportSVG() {
  try {
    const flow = FLOWS[currentFlowIndex];
    const svg = document.getElementById('canvas-svg');
    if (!svg) { alert('未找到流程图 SVG'); return; }

    // 克隆并剥离交互属性
    const clone = svg.cloneNode(true);
    clone.setAttribute('xmlns', 'http://www.w3.org/2000/svg');
    clone.setAttribute('xmlns:xlink', 'http://www.w3.org/1999/xlink');
    // 清除所有 onclick / onmouseenter / onmouseleave / class=dimmed/highlighted
    clone.querySelectorAll('[onclick]').forEach(el => el.removeAttribute('onclick'));
    clone.querySelectorAll('[onmouseenter]').forEach(el => el.removeAttribute('onmouseenter'));
    clone.querySelectorAll('[onmouseleave]').forEach(el => el.removeAttribute('onmouseleave'));
    clone.querySelectorAll('.dimmed,.highlighted').forEach(el => {
      el.classList.remove('dimmed', 'highlighted');
    });

    // 当前主题下 CSS 变量的真实颜色
    const isLight = document.body.classList.contains('theme-light');
    const cssVarMap = {
      '--text-primary':   isLight ? '#1d1d1f' : '#cdd6f4',
      '--text-secondary': isLight ? '#3a3a3c' : '#a6adc8',
      '--text-muted':     isLight ? '#8e8e93' : '#6c7086',
      '--bg-primary':     isLight ? '#ffffff' : '#1e1e2e',
      '--bg-secondary':   isLight ? '#f5f5f7' : '#181825',
      '--bg-tertiary':    isLight ? '#e5e5ea' : '#313244',
      '--border-color':   isLight ? '#d1d1d6' : '#45475a',
      '--accent-blue':    '#89b4fa',
      '--accent-green':   '#a6e3a1',
      '--accent-orange':  '#fab387',
      '--accent-purple':  '#cba6f7',
      '--accent-red':     '#f38ba8',
      '--accent-gray':    '#9399b2',
      '--accent-teal':    '#94e2d5'
    };

    // 在克隆的 SVG 根部插入背景矩形
    const w = parseFloat(svg.getAttribute('width')) || 800;
    const h = parseFloat(svg.getAttribute('height')) || 600;
    const bgRect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
    bgRect.setAttribute('x', '0');
    bgRect.setAttribute('y', '0');
    bgRect.setAttribute('width', w);
    bgRect.setAttribute('height', h);
    bgRect.setAttribute('fill', cssVarMap['--bg-primary']);
    clone.insertBefore(bgRect, clone.firstChild);

    // 序列化后替换所有 var(--xxx)
    let svgStr = new XMLSerializer().serializeToString(clone);
    Object.entries(cssVarMap).forEach(([k, v]) => {
      const re = new RegExp('var\\(\\' + '-' + '-' + k.substring(2).replace(/-/g, '\\-') + '\\)', 'g');
      svgStr = svgStr.replace(re, v);
    });
    // 兜底：再处理可能残留的 var(...)
    svgStr = svgStr.replace(/var\([^)]+\)/g, cssVarMap['--text-primary']);

    // 确保带 XML 声明
    if (!svgStr.startsWith('<?xml')) {
      svgStr = '<?xml version="1.0" encoding="UTF-8" standalone="no"?>\n' + svgStr;
    }

    // 触发下载
    const blob = new Blob([svgStr], { type: 'image/svg+xml;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `ragent-flow-${flow.id}-${Date.now()}.svg`;
    a.style.display = 'none';
    document.body.appendChild(a);
    a.click();
    setTimeout(() => {
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }, 100);
  } catch (err) {
    console.error('[exportSVG] 导出失败', err);
    alert('导出失败：' + (err && err.message ? err.message : err));
  }
}

function toggleMobileSidebar() {
  document.querySelector('.sidebar').classList.toggle('mobile-open');
}

/* ====================================================================================
 *  键盘快捷键
 * ==================================================================================== */
document.addEventListener('keydown', function(e) {
  // 输入框聚焦时不触发
  const isTyping = ['INPUT', 'TEXTAREA'].includes(document.activeElement.tagName);

  if (e.key === 'Escape') {
    closeDetailPanel();
    document.getElementById('search-results').classList.remove('open');
    document.getElementById('search-input').blur();
    return;
  }

  if (isTyping) return;

  if (e.key === '/') {
    e.preventDefault();
    document.getElementById('search-input').focus();
  } else if (e.key === 'ArrowLeft' && !document.getElementById('detail-panel').classList.contains('open')) {
    if (currentFlowIndex > 0) selectFlow(currentFlowIndex - 1);
  } else if (e.key === 'ArrowRight' && !document.getElementById('detail-panel').classList.contains('open')) {
    if (currentFlowIndex < FLOWS.length - 1) selectFlow(currentFlowIndex + 1);
  } else if (e.key === 'ArrowLeft' && document.getElementById('detail-panel').classList.contains('open')) {
    navigateNode(-1);
  } else if (e.key === 'ArrowRight' && document.getElementById('detail-panel').classList.contains('open')) {
    navigateNode(1);
  }
});

/* ====================================================================================
 *  初始化
 * ==================================================================================== */
function init() {
  // 恢复主题
  try {
    if (localStorage.getItem('ragent-flow-theme') === 'light') {
      document.body.classList.add('theme-light');
      document.getElementById('theme-btn').textContent = '☀️';
    }
  } catch (e) {}

  updateGlobalStats();
  renderNav();
  renderFlowHeader();
  renderFlowDiagram();
  renderDecisions();
  initSearch();
  // 首次渲染后居中
  setTimeout(fitCanvasToView, 50);

  // 窗口大小变化时重新居中
  let resizeTimer;
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(fitCanvasToView, 200);
  });
}

init();
